# Blueprint de Render: crea la base PostgreSQL y el servicio web juntos.
# Render -> New -> Blueprint -> elige este repositorio. Las variables con "sync: false" las pide al crearlo.
services:
  - type: web
    name: farmacia-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      # Internal Database URL de la base de abajo (sin SSL, no sale a internet)
      - key: DATABASE_URL
        fromDatabase:
          name: farmacia-db
          property: connectionString
      # Render genera una clave aleatoria
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # URL pública del frontend (sin / al final)
      - key: FRONTEND_URL
        sync: false

databases:
  - name: farmacia-db
    plan: free
    databaseName: farmacia
    user: farmacia
